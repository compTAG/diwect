[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diwect-vs-wect"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "h5py",
    "matplotlib",
    "medmnist",
    "numpy",
    "pandas",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "torch",
    "torchvision",
    "trimesh",
]

exclude = ["synthetic.rotation-invariance*"]
namespaces = true

[tool.setuptools.package-dir]
"" = "scratch"
